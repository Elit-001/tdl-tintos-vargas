name: Integración Continua y Seguridad SQA - AgroPulse TDL

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calidad-y-seguridad-ci:
    name: CI/CD (Pytest + Ruff + Gitleaks + pip-audit)
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Revisión de estilo (Ruff)
        run: ruff check .

      - name: Ejecución de pruebas unitarias (Pytest)
        run: pytest tests/ -v

      - name: Búsqueda de secretos expuestos (Gitleaks)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | tar -xz -C /usr/local/bin gitleaks
          gitleaks detect --source . --no-banner -v

      - name: Análisis de vulnerabilidades en librerías (pip-audit)
        run: pip-audit

