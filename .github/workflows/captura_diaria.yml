name: Captura Diaria y CI/CD - AgroPulse TDL

on:
  push:
    branches: ["main"]
  schedule:
    # Ejecución diaria programada a las 08:00 UTC (02:00 CST Colima/CDMX)
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  integracion-continua-y-seguridad:
    name: Pruebas, Estilo, Secretos y Vulnerabilidades (E1)
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio con historial completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias del proyecto y parches base
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install --upgrade -r requirements.txt

      - name: Revisión estática de estilo y calidad de código (Ruff)
        run: ruff check .

      - name: Ejecución de pruebas unitarias automatizadas (Pytest)
        run: pytest tests/ -v

      - name: Escaneo de secretos expuestos en el repositorio (Gitleaks)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | tar -xz -C /usr/local/bin gitleaks
          gitleaks detect --source . --no-banner -v

      - name: Auditoría de vulnerabilidades en dependencias (pip-audit)
        run: pip-audit --skip-editable --progress-spinner off

  captura-y-pipeline-medallion:
    name: Extracción Multifuente y Procesamiento Medallion (Bronce -> Oro)
    needs: integracion-continua-y-seguridad
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias del proyecto
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install --upgrade -r requirements.txt

      - name: Ejecutar extractores multifuente hacia Capa Bronce
        run: python -m extractores.ejecutar_captura

      - name: Ejecutar pipeline Medallion E1 (Plata, Cuarentena y Oro)
        run: python -m pipeline.orquestador_e1

      - name: Confirmar y subir datos actualizados y bitácora
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bronce/ data/plata/ data/oro/ data/cuarentena/ calidad/bitacora_captura.csv
          git diff --staged --quiet || git commit -m "chore(pipeline): actualización automática Medallion y bitácora"
          git push
