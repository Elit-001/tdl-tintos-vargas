name: Captura Diaria Automatizada - AgroPulse TDL

on:
  schedule:
    # Ejecución diaria programada a las 08:00 UTC (02:00 CST Colima/CDMX)
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  captura-capa-bronce:
    name: Extracción Multifuente y Bitácora de Fiabilidad
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias del proyecto
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar extractores multifuente hacia Capa Bronce
        run: python -m extractores.ejecutar_captura

      - name: Ejecutar verificación de calidad con pytest y ruff
        run: |
          ruff check .
          pytest -v

      - name: Confirmar y subir datos actualizados de Bronce y Bitácora
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bronce/ calidad/bitacora_captura.csv
          git diff --staged --quiet || git commit -m "chore(bronce): captura automática diaria y registro en bitácora"
          git push

